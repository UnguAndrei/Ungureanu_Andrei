
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare bruta</title>

    <script>
    // Afisare masina Local Storage
    function loadMls() {
        if (localStorage.tip) {
            var tL = localStorage.tip;
            var mL = localStorage.model;
            var cL = localStorage.culoare;

            document.getElementById("mls").innerHTML =
                "<ul>" +
                "<li>Tip: " + tL + "</li>" +
                "<li>Model: " + mL + "</li>" +
                "<li>Culoare: " + cL + "</li>" +
                "</ul>";
        } else {
            document.getElementById("mls").innerHTML =
                "Nicio masina salvata";
        }
    }

    function salveazaMls() {
        localStorage.tip = document.getElementById("tipL").value;
        localStorage.model = document.getElementById("modelL").value;
        localStorage.culoare = document.getElementById("culoareL").value;

        loadMls();
        return false;
    }

    function stergeMls() {
        localStorage.removeItem("tip");
        localStorage.removeItem("model");
        localStorage.removeItem("culoare");
        loadMls();
    }

    // Afisare masina Session Storage
    function loadMss() {
        if (sessionStorage.tip) {
            var tS = sessionStorage.tip;
            var mS = sessionStorage.model;
            var cS = sessionStorage.culoare;

            document.getElementById("mss").innerHTML =
                "<ul>" +
                "<li>Tip: " + tS + "</li>" +
                "<li>Model: " + mS + "</li>" +
                "<li>Culoare: " + cS + "</li>" +
                "</ul>";
        } else {
            document.getElementById("mss").innerHTML =
                "Nicio masina salvata";
        }
    }

    function salveazaMss() {
        sessionStorage.tip = document.getElementById("tipS").value;
        sessionStorage.model = document.getElementById("modelS").value;
        sessionStorage.culoare = document.getElementById("culoareS").value;

        loadMss();
        return false;
    }

    function stergeMss() {
        sessionStorage.removeItem("tip");
        sessionStorage.removeItem("model");
        sessionStorage.removeItem("culoare");
        loadMss();
    }

    function initializare() {
        loadMls();
        loadMss();
    }
    </script>
</head>

<body onload="initializare()">

    <div style="background-color:ForestGreen;color:white;font-size:200%">
        <p>Masina Local Storage</p>

        <form onsubmit="return salveazaMls()">
            <label for="tipL">Tip</label>
            <input id="tipL" required>

            <label for="modelL">Model</label>
            <input id="modelL" required>

            <label for="culoareL">Culoare</label>
            <input id="culoareL" required>

            <button type="submit">Salveaza</button>
            <button type="button" onclick="stergeMls()">Sterge</button>
        </form>

        <div id="mls"></div>
    </div>

    <div style="background-color:SeaGreen;color:white;font-size:200%">
        <p>Masina Session Storage</p>

        <form onsubmit="return salveazaMss()">
            <label for="tipS">Tip</label>
            <input id="tipS" required>

            <label for="modelS">Model</label>
            <input id="modelS" required>

            <label for="culoareS">Culoare</label>
            <input id="culoareS" required>

            <button type="submit">Salveaza</button>
            <button type="button" onclick="stergeMss()">Sterge</button>
        </form>

        <div id="mss"></div>
    </div>

</body>
</html>
