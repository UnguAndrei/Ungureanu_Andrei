
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare cu obiecte</title>

    <script>
    // Functie generala de afisare
    function afiseaza(depozit, id) {
        var masina = depozit.getItem("masina");

        if (masina) {
            var masinaObj = JSON.parse(masina);

            document.getElementById(id).innerHTML =
                "<ul>" +
                "<li>Tip: " + masinaObj.tip + "</li>" +
                "<li>Model: " + masinaObj.model + "</li>" +
                "<li>Culoare: " + masinaObj.culoare + "</li>" +
                "<li>An fabricatie: " + masinaObj.anFab + "</li>" +
                "</ul>";
        } else {
            document.getElementById(id).innerHTML =
                "Nicio masina salvata";
        }
    }

    // Salvare Local Storage
    function salveazaMls() {
        var masinaL = {
            tip: document.getElementById("tipL").value,
            model: document.getElementById("modelL").value,
            culoare: document.getElementById("culoareL").value,
            anFab: document.getElementById("anL").value
        };

        localStorage.setItem("masina", JSON.stringify(masinaL));

        afiseaza(localStorage, "mls");
        return false;
    }

    // Stergere Local Storage
    function stergeMls() {
        localStorage.removeItem("masina");
        afiseaza(localStorage, "mls");
    }

    // Salvare Session Storage
    function salveazaMss() {
        var masinaS = {
            tip: document.getElementById("tipS").value,
            model: document.getElementById("modelS").value,
            culoare: document.getElementById("culoareS").value,
            anFab: document.getElementById("anS").value
        };

        sessionStorage.setItem("masina", JSON.stringify(masinaS));

        afiseaza(sessionStorage, "mss");
        return false;
    }

    // Stergere Session Storage
    function stergeMss() {
        sessionStorage.removeItem("masina");
        afiseaza(sessionStorage, "mss");
    }

    // Initializare
    function initializare() {
        afiseaza(localStorage, "mls");
        afiseaza(sessionStorage, "mss");
    }
    </script>
</head>

<body onload="initializare()">

    <div style="background-color:ForestGreen;color:white;font-size:200%">
        <p>Masina Local Storage</p>

        <form onsubmit="return salveazaMls()">
            <label for="tipL">Tip</label>
            <input id="tipL" required>

            <label for="modelL">Model</label>
            <input id="modelL" required>

            <label for="culoareL">Culoare</label>
            <input id="culoareL" required>

            <label for="anL">An fabricatie</label>
            <input id="anL" type="number" required>

            <button type="submit">Salveaza</button>
            <button type="button" onclick="stergeMls()">Sterge</button>
        </form>

        <div id="mls"></div>
    </div>

    <div style="background-color:SeaGreen;color:white;font-size:200%">
        <p>Masina Session Storage</p>

        <form onsubmit="return salveazaMss()">
            <label for="tipS">Tip</label>
            <input id="tipS" required>

            <label for="modelS">Model</label>
            <input id="modelS" required>

            <label for="culoareS">Culoare</label>
            <input id="culoareS" required>

            <label for="anS">An fabricatie</label>
            <input id="anS" type="number" required>

            <button type="submit">Salveaza</button>
            <button type="button" onclick="stergeMss()">Sterge</button>
        </form>

        <div id="mss"></div>
    </div>

</body>
</html>
